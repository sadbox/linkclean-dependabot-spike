name: ci
on:
  pull_request: {}
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  test:
    strategy: {fail-fast: false, matrix: {go: ["1.26.x", "stable"]}}
    name: test (${{ matrix.go }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; submodules not checked out
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "${{ matrix.go }}"}
      - run: go vet ./... && go test -race ./...
      - run: go -C tools vet ./...
